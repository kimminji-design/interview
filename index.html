<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>면접 준비 노트</title>
<link rel="stylesheet" href="workspace.css?v=3">
</head>
<body>
<section id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <p class="eyebrow">INTERVIEW NOTES</p><h1>면접 준비 노트</h1><p class="muted">나의 경험을 정리하고, 말로 연습하는 공간.</p>
    <label for="gate-input">비밀번호</label><input id="gate-input" type="password" inputmode="numeric" autocomplete="off" required>
    <button class="primary">입장하기</button><p id="gate-error" role="alert"></p>
  </form>
</section>
<div id="app" hidden>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">m.</span><span>면접 준비 노트</span></div>
    <div class="sync-controls"><span id="sync-status" role="status">이 기기 저장</span><button id="refresh-btn">새로고침</button><button id="sync-btn">GitHub 저장</button><button id="settings-btn" aria-label="GitHub 연결 설정">연결 설정</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-heading"><span>기업별 노트</span><button id="add-company-btn" class="small">+ 추가</button></div>
      <nav id="companies" aria-label="기업 선택"></nav>
      <div class="sidebar-footer"><button id="transfer-btn">가져오기 / 내보내기</button><p>PC와 휴대폰에서 같은 노트를.<br>GitHub 저장 상태를 확인해주세요.</p></div>
    </aside>
    <main id="main-content">
      <div class="page-heading"><div><p class="eyebrow">MY INTERVIEW WORKSPACE</p><h1 id="company-title"></h1><p id="company-count" class="muted"></p></div><div class="actions"><button id="company-menu-btn">기업 관리</button><button id="add-question-btn" class="primary">+ 질문 추가</button></div></div>
      <div class="tabs" role="tablist" aria-label="화면 모드"><button data-view="manage" role="tab">질문 관리</button><button data-view="study" role="tab">전체 연습</button><button data-view="starred" role="tab">중요 질문</button><button data-view="live" role="tab">실전 연습</button></div>
      <section id="workspace">
        <div class="filters"><input id="search" type="search" aria-label="질문 답변 검색" placeholder="질문·답변·꼬리질문 검색"><select id="category-filter" aria-label="카테고리 필터"></select><select id="status-filter" aria-label="준비 상태"><option value="all">모든 상태</option><option value="draft">작성 중</option><option value="review">검토 필요</option><option value="ready">준비 완료</option><option value="empty">답변 없음</option><option value="favorite">중요 질문</option></select><button id="category-btn">분류 / 순서</button></div>
        <div class="list-meta"><span id="result-count"></span><label id="keyword-only-label"><input type="checkbox" id="keyword-only"> 키워드만 보기</label><button id="copy-questions-btn">다른 기업에서 가져오기</button><button id="bulk-btn">여러 문항 붙여넣기</button></div>
        <div id="bulk-actions" class="bulk-actions" hidden><span id="selected-count"></span><button id="bulk-star">중요 표시</button><button id="bulk-unstar">중요 해제</button><button id="bulk-move">분류 이동</button><button id="bulk-delete" class="danger">삭제</button><button id="bulk-clear">선택 해제</button></div>
        <div id="question-list"></div>
      </section>
      <section id="live" hidden></section>
    </main>
  </div>
</div>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="workspace.mjs?v=3"></script>
</body></html>
