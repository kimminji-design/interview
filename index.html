<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>면접 답변 연습</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate-view" class="view active">
  <div class="gate">
    <h1 class="gate__title">🔒 비밀번호 확인</h1>
    <p class="gate__desc">면접 답변 연습 페이지입니다.<br />비밀번호를 입력해주세요.</p>
    <form id="gate-form" class="gate__form">
      <input
        id="gate-input"
        class="gate__input"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="비밀번호"
        autofocus
      />
      <button type="submit" class="mode-btn gate__submit">
        <span class="mode-btn__label">입장하기</span>
      </button>
      <p id="gate-error" class="gate__error" hidden>비밀번호가 올바르지 않습니다.</p>
    </form>
  </div>
</div>

<div id="company-view" class="view">
  <div class="company-select">
    <h1 class="company-select__title">기업 선택</h1>
    <p class="company-select__desc">면접을 연습할 기업을 선택하세요.</p>
    <div id="company-list" class="company-list"></div>
    <button id="btn-add-company" class="mode-btn company-add-btn">
      <span class="mode-btn__label">+ 기업 추가</span>
    </button>
  </div>
</div>

<div id="landing-view" class="view">
  <div class="landing">
    <button id="btn-change-company" class="back-btn landing__change-company">← 기업 변경</button>
    <h1 class="landing__title">면접 답변 연습</h1>
    <p id="landing-company-name" class="landing__company-badge"></p>
    <p class="landing__desc">연습할 버전을 선택하세요.</p>
    <div class="landing__buttons">
      <button id="btn-full" class="mode-btn">
        <span class="mode-btn__label">풀버전</span>
        <span class="mode-btn__sub">전체 질문 + 즐겨찾기 · 수정 · 추가</span>
      </button>
      <button id="btn-summary" class="mode-btn">
        <span class="mode-btn__label">요약버전</span>
        <span class="mode-btn__sub">★ 즐겨찾기한 질문만</span>
      </button>
      <button id="btn-live" class="mode-btn mode-btn--live">
        <span class="mode-btn__label">🎤 실전 면접</span>
        <span class="mode-btn__sub">즐겨찾기한 질문으로 1:1 연습</span>
      </button>
    </div>
  </div>
</div>

<div id="list-view" class="view">
  <header class="list-header">
    <button id="btn-back" class="back-btn">← 뒤로가기</button>
    <h1 id="list-title" class="list-header__title"></h1>
  </header>
  <div id="list-toolbar" class="list-toolbar" hidden>
    <button id="btn-add-question" class="toolbar-btn">+ 질문 추가</button>
    <button id="btn-delete-mode" class="toolbar-btn toolbar-btn--danger">삭제</button>
    <div id="delete-mode-actions" class="delete-mode-actions" hidden>
      <span id="delete-selected-count" class="delete-mode-actions__count">0개 선택</span>
      <button id="btn-delete-selected" class="toolbar-btn toolbar-btn--danger" disabled>선택 삭제</button>
      <button id="btn-delete-cancel" class="toolbar-btn">취소</button>
    </div>
  </div>
  <main id="accordion-root" class="accordion-root"></main>
</div>

<div id="live-view" class="view">
  <div id="live-stage" class="live-stage">
    <button id="btn-live-exit" class="live-exit-btn">← 종료</button>
    <div id="live-progress" class="live-progress"></div>
    <div id="live-timer" class="live-timer">0초</div>

    <div class="live-bubble">
      <div class="live-bubble__row live-bubble__row--question">
        <span class="live-tag live-tag--interviewer">면접관</span>
        <p id="live-question-text" class="live-question-text"></p>
      </div>
      <div id="live-answer-row" class="live-bubble__row live-bubble__row--answer" hidden>
        <span class="live-tag live-tag--you">지원자 답변</span>
        <div id="live-answer-keywords" class="qa-keyword-chips"></div>
        <p id="live-answer-text" class="qa-answer-text"></p>
      </div>
      <p id="live-hint" class="live-hint"></p>
    </div>
  </div>

  <div id="live-end" class="live-end" hidden>
    <h2 class="live-end__title">수고하셨습니다 🎉</h2>
    <p class="live-end__desc">준비한 질문을 모두 마쳤어요.</p>
    <div class="live-end__buttons">
      <button id="btn-live-restart" class="mode-btn mode-btn--live">
        <span class="mode-btn__label">다시 연습하기</span>
        <span class="mode-btn__sub">질문 순서를 새로 섞어서 시작</span>
      </button>
      <button id="btn-live-home" class="back-btn">홈으로</button>
    </div>
  </div>
</div>

<!-- 기업 추가 모달 -->
<div id="modal-add-company" class="modal-overlay" hidden>
  <div class="modal">
    <h2 class="modal__title">기업 추가</h2>
    <label class="modal__label" for="add-company-name">기업명</label>
    <input id="add-company-name" class="modal__input" type="text" placeholder="예: 세스코" />

    <p class="modal__label">데이터 소스</p>
    <div class="modal__radio-list">
      <label class="modal__radio-option">
        <input type="radio" name="add-company-source-mode" value="copy" checked />
        <span>기존 기업 데이터 복사</span>
      </label>
      <label class="modal__radio-option">
        <input type="radio" name="add-company-source-mode" value="upload" />
        <span>텍스트 파일 업로드</span>
      </label>
    </div>

    <div id="add-company-copy-section">
      <p class="modal__label">복사할 기업</p>
      <div id="add-company-source-list" class="modal__radio-list"></div>
    </div>

    <div id="add-company-upload-section" hidden>
      <p class="modal__label">텍스트 파일 선택</p>
      <label for="add-company-file-input" class="modal__file-drop">
        <span id="add-company-file-name">클릭해서 .txt 파일을 선택하세요</span>
      </label>
      <input id="add-company-file-input" class="modal__file-input" type="file" accept=".txt,text/plain" />
      <p class="modal__hint">"Q. " 또는 "⭐ Q. "로 시작하는 질문 포맷의 텍스트 파일이어야 합니다.</p>
    </div>

    <p id="add-company-error" class="gate__error" hidden></p>
    <div class="modal__buttons">
      <button id="btn-add-company-cancel" type="button" class="qa-cancel-btn">취소</button>
      <button id="btn-add-company-confirm" type="button" class="qa-save-btn">추가</button>
    </div>
  </div>
</div>

<!-- 질문 추가 모달 -->
<div id="modal-add-question" class="modal-overlay" hidden>
  <div class="modal">
    <h2 class="modal__title">질문 추가</h2>
    <label class="modal__label" for="add-q-category">카테고리</label>
    <input
      id="add-q-category"
      class="modal__input"
      type="text"
      list="add-q-category-options"
      placeholder="예: 자기소개 · 이직 (없는 이름이면 새로 만들어져요)"
    />
    <datalist id="add-q-category-options"></datalist>
    <label class="modal__label" for="add-q-question">질문</label>
    <input id="add-q-question" class="modal__input" type="text" placeholder="질문을 입력하세요" />
    <label class="modal__label" for="add-q-answer">답변</label>
    <textarea id="add-q-answer" class="modal__textarea" placeholder="답변을 입력하세요"></textarea>
    <p id="add-question-error" class="gate__error" hidden></p>
    <div class="modal__buttons">
      <button id="btn-add-question-cancel" type="button" class="qa-cancel-btn">취소</button>
      <button id="btn-add-question-confirm" type="button" class="qa-save-btn">추가</button>
    </div>
  </div>
</div>

<!-- 범용 확인 모달 (기업 삭제 / 질문 삭제) -->
<div id="modal-confirm" class="modal-overlay" hidden>
  <div class="modal modal--confirm">
    <p id="modal-confirm-message" class="modal__message"></p>
    <div class="modal__buttons">
      <button id="btn-confirm-cancel" type="button" class="qa-cancel-btn">취소</button>
      <button id="btn-confirm-ok" type="button" class="qa-save-btn qa-save-btn--danger">삭제</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="parser.js"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
